<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>It's a Match! Overlay - PROOVD</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#45D891", // Primary Green
              "primary-dark": "#24724D",
              "background-light": "#F9FAF8",
              "background-dark": "#09110C", // Dark background from palette
              "surface-dark": "#152019", // Slightly lighter dark for cards
              "card-green": "#BCFCA1", // Pale Green for the left card
              "deep-green": "#1E4D2F",
              "soft-cyan": "#C8FCFF",
              "mid-green": "#5BAA77",
            },
            fontFamily: {
              display: ["'Plus Jakarta Sans'", "sans-serif"],
              sans: ["'Plus Jakarta Sans'", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              xl: "1rem",
              "2xl": "1.5rem",
              "3xl": "2rem",
            },
            animation: {
              float: "float 6s ease-in-out infinite",
              "heart-glow": "heartGlow 2s ease-in-out infinite alternate",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-10px)" },
              },
              heartGlow: {
                "0%, 100%": {
                  filter: "drop-shadow(0 0 4px rgba(69, 216, 145, 0.4))",
                },
                "50%": {
                  filter: "drop-shadow(0 0 10px rgba(69, 216, 145, 0.7))",
                },
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .bg-pattern {
        background-image: radial-gradient(
          circle at 1px 1px,
          rgba(255, 255, 255, 0.05) 1px,
          transparent 0
        );
        background-size: 24px 24px;
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-white transition-colors duration-300 min-h-screen relative overflow-hidden font-sans">
    <div
      aria-hidden="true"
      class="p-6 md:p-10 w-full h-screen overflow-y-hidden blur-[3px] opacity-30 dark:opacity-40 pointer-events-none select-none bg-pattern">
      <header class="flex justify-between items-end mb-12">
        <div>
          <h2
            class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-gray-100 mb-2 tracking-tight">
            Affiliate Matches
          </h2>
          <p class="text-gray-500 dark:text-gray-400 text-sm md:text-base">
            Send pitches to matched affiliates and track their responses
          </p>
        </div>
        <div class="relative hidden md:block">
          <div
            class="h-12 w-12 rounded-full bg-white dark:bg-surface-dark border border-gray-200 dark:border-deep-green flex items-center justify-center text-gray-600 dark:text-primary shadow-sm">
            <span class="material-icons-round">notifications</span>
          </div>
          <span
            class="absolute top-0 right-0 h-4 w-4 bg-red-500 rounded-full border-2 border-background-light dark:border-background-dark"></span>
        </div>
      </header>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
        <div
          class="bg-white dark:bg-surface-dark p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-deep-green flex items-center gap-5">
          <div
            class="h-14 w-14 rounded-xl bg-gray-100 dark:bg-deep-green/30 flex items-center justify-center text-gray-500 dark:text-primary">
            <span class="material-icons-round text-2xl">person</span>
          </div>
          <div>
            <div class="text-3xl font-bold dark:text-white">6</div>
            <div
              class="text-xs text-gray-500 dark:text-gray-400 font-semibold uppercase tracking-wider mt-1">
              Total Matches
            </div>
          </div>
        </div>
        <div
          class="bg-white dark:bg-surface-dark p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-deep-green flex items-center gap-5">
          <div
            class="h-14 w-14 rounded-xl bg-gray-100 dark:bg-deep-green/30 flex items-center justify-center text-gray-500 dark:text-primary">
            <span class="material-icons-round text-2xl">mail</span>
          </div>
          <div>
            <div class="text-3xl font-bold dark:text-white">18</div>
            <div
              class="text-xs text-gray-500 dark:text-gray-400 font-semibold uppercase tracking-wider mt-1">
              Pitches Sent
            </div>
          </div>
        </div>
        <div
          class="bg-white dark:bg-surface-dark p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-deep-green flex items-center gap-5">
          <div
            class="h-14 w-14 rounded-xl bg-gray-100 dark:bg-deep-green/30 flex items-center justify-center text-gray-500 dark:text-primary">
            <span class="material-icons-round text-2xl">pie_chart</span>
          </div>
          <div>
            <div class="text-3xl font-bold dark:text-white">7</div>
            <div
              class="text-xs text-gray-500 dark:text-gray-400 font-semibold uppercase tracking-wider mt-1">
              Response Rate
            </div>
          </div>
        </div>
        <div
          class="bg-white dark:bg-surface-dark p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-deep-green flex items-center gap-5">
          <div
            class="h-14 w-14 rounded-xl bg-gray-100 dark:bg-deep-green/30 flex items-center justify-center text-gray-500 dark:text-primary">
            <span class="material-icons-round text-2xl">verified</span>
          </div>
          <div>
            <div class="text-3xl font-bold dark:text-white">25%</div>
            <div
              class="text-xs text-gray-500 dark:text-gray-400 font-semibold uppercase tracking-wider mt-1">
              Top Performer
            </div>
          </div>
        </div>
      </div>
      <div
        class="bg-white dark:bg-surface-dark rounded-3xl border border-gray-200 dark:border-deep-green h-96 w-full p-8 opacity-75">
        <div
          class="flex gap-6 mb-8 border-b border-gray-100 dark:border-deep-green pb-4">
          <div class="h-8 w-32 bg-gray-200 dark:bg-deep-green rounded-lg"></div>
          <div
            class="h-8 w-32 bg-gray-100 dark:bg-deep-green/30 rounded-lg"></div>
        </div>
        <div class="flex items-center gap-6 mb-6">
          <div
            class="h-20 w-20 rounded-full bg-gray-200 dark:bg-deep-green"></div>
          <div class="space-y-3 flex-1">
            <div class="h-6 w-1/3 bg-gray-200 dark:bg-deep-green rounded"></div>
            <div
              class="h-4 w-1/4 bg-gray-100 dark:bg-deep-green/50 rounded"></div>
          </div>
        </div>
        <div class="flex items-center gap-6">
          <div
            class="h-20 w-20 rounded-full bg-gray-200 dark:bg-deep-green"></div>
          <div class="space-y-3 flex-1">
            <div class="h-6 w-1/3 bg-gray-200 dark:bg-deep-green rounded"></div>
            <div
              class="h-4 w-1/4 bg-gray-100 dark:bg-deep-green/50 rounded"></div>
          </div>
        </div>
      </div>
    </div>
    <div
      class="fixed inset-0 bg-background-light/60 dark:bg-background-dark/80 backdrop-blur-sm z-40 transition-all duration-700"></div>
    <div
      class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6">
      <div
        class="flex flex-col items-center animate-fade-in-up max-w-lg w-full">
        <h1
          class="text-5xl md:text-7xl font-extrabold text-gray-900 dark:text-white mb-16 tracking-tighter drop-shadow-lg text-center font-display">
          Its a Match!
        </h1>
        <div
          class="relative w-80 h-80 md:w-96 md:h-96 flex items-center justify-center mb-16 animate-float">
          <div
            class="absolute w-[160px] h-[220px] md:w-[180px] md:h-[250px] bg-card-green rounded-3xl shadow-xl transform -rotate-[8deg] -translate-x-[5rem] translate-y-2 border-[3px] border-white dark:border-background-dark z-10 flex flex-col items-center justify-center overflow-hidden">
            <div
              class="absolute top-0 w-full h-full bg-gradient-to-br from-white/20 to-transparent"></div>
          </div>
          <div
            class="absolute w-[170px] h-[230px] md:w-[190px] md:h-[260px] bg-white rounded-3xl shadow-xl transform rotate-[8deg] translate-x-[5rem] -translate-y-2 border-[3px] border-gray-100 dark:border-primary z-20 flex flex-col items-center justify-center overflow-hidden">
            <div
              class="absolute top-0 w-full h-full bg-gradient-to-bl from-gray-50/50 to-transparent"></div>
          </div>
          <div class="absolute z-30 transform scale-150 animate-heart-glow">
            <div class="relative">
              <svg
                fill="currentColor"
                height="64"
                viewBox="0 0 24 24"
                width="64"
                xmlns="http://www.w3.org/2000/svg">
                <path
                  class="fill-primary"
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
              </svg>
            </div>
          </div>
        </div>
        <div class="text-center px-4">
          <p
            class="text-xl md:text-2xl text-gray-800 dark:text-gray-100 font-medium leading-relaxed">
            Our algorithm matched you with four affiliates
          </p>
        </div>
        <div
          class="mt-10 opacity-0 animate-[fadeIn_0.5s_ease-out_0.8s_forwards]">
          <button
            class="bg-primary hover:bg-mid-green text-background-dark font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-primary/50 transition-all duration-300 transform hover:-translate-y-1">
            View Matches
          </button>
        </div>
      </div>
    </div>
    <div class="fixed top-6 right-6 z-[60]">
      <button
        class="p-3 rounded-full bg-black/20 dark:bg-white/10 text-gray-800 dark:text-white hover:bg-black/30 dark:hover:bg-white/20 backdrop-blur-md transition shadow-lg border border-transparent dark:border-white/10"
        onclick="document.documentElement.classList.toggle('dark')">
        <span class="material-icons-round text-xl">dark_mode</span>
      </button>
    </div>
    <style>
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
    <script>
      // Force dark mode initially as requested for the night mode theme presentation
      if (
        localStorage.getItem("color-theme") === "dark" ||
        (!("color-theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        // Defaulting to dark as per specific prompt instruction "adhere to our established night mode theme"
        document.documentElement.classList.add("dark");
      }
    </script>
  </body>
</html>
