<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pitch Business Idea (Voice Controls)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;700;900&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bgDark: "#09110C",
              primary: "#45D891",
              primaryDark: "#24724D",
              surfaceDark: "#1E4D2F",
              accentGreen: "#5BAA77",
              textLight: "#BCFCA1",
              highlight: "#C8FCFF",
              offWhite: "#F9FAF8",
            },
            fontFamily: {
              sans: ["Satoshi", "sans-serif"],
            },
            animation: {
              wave: "wave 1.2s ease-in-out infinite",
            },
            keyframes: {
              wave: {
                "0%, 100%": { transform: "scaleY(0.4)" },
                "50%": { transform: "scaleY(1.2)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #09110c;
        font-family: "Satoshi", sans-serif;
      }
      .wave-bar {
        width: 4px;
        background: linear-gradient(to top, #24724d, #45d891);
        border-radius: 9999px;
        animation: wave 1s ease-in-out infinite;
        transform-origin: bottom;
      }
      .wave-bar:nth-child(odd) {
        animation-duration: 0.8s;
      }
      .wave-bar:nth-child(2n) {
        animation-duration: 1.1s;
      }
      .wave-bar:nth-child(3n) {
        animation-duration: 1.3s;
      }
      .wave-bar:nth-child(4n) {
        animation-duration: 0.9s;
      }
      .wave-bar:nth-child(5n) {
        animation-duration: 1.2s;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center p-6 text-offWhite relative overflow-hidden">
    <div
      class="absolute top-[-20%] left-0 right-0 h-[600px] bg-gradient-to-b from-surfaceDark/20 to-transparent pointer-events-none blur-3xl opacity-40"></div>
    <div
      class="absolute bottom-[-10%] right-[-10%] w-[300px] h-[300px] bg-primary/10 rounded-full blur-[80px] pointer-events-none"></div>
    <header class="w-full flex justify-center mt-6 mb-8 relative z-10">
      <div class="flex items-center gap-2">
        <div
          class="font-black text-2xl tracking-[0.2em] text-white select-none">
          PROOVD
        </div>
        <div class="w-2 h-2 rounded-full bg-primary mt-1"></div>
      </div>
    </header>
    <main
      class="flex-1 w-full max-w-3xl flex flex-col items-center justify-center text-center relative z-10">
      <h1
        class="text-5xl md:text-7xl font-black tracking-tight mb-4 leading-tight">
        Pitch your<br />
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r from-offWhite to-gray-400"
          >Business Idea</span
        >
      </h1>
      <p class="text-xl md:text-2xl text-accentGreen font-medium mb-16">
        and we'll transform it for Success
      </p>
      <div class="relative w-full flex flex-col items-center gap-8 mb-12">
        <div class="flex items-center justify-center gap-8 md:gap-12">
          <button
            class="group flex items-center justify-center w-16 h-16 md:w-20 md:h-20 rounded-full bg-surfaceDark border border-primary/10 hover:border-primary/50 transition-all duration-300 hover:scale-105 shadow-lg shadow-black/20">
            <span
              class="material-symbols-outlined text-textLight text-3xl md:text-4xl group-hover:-rotate-180 transition-transform duration-500"
              >refresh</span
            >
          </button>
          <div class="relative group">
            <div
              class="absolute inset-0 rounded-full bg-primary blur-2xl opacity-20 group-hover:opacity-40 transition-opacity duration-300"></div>
            <button
              class="relative flex items-center justify-center w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-b from-[#152e1f] to-bgDark border-2 border-primary shadow-[0_0_15px_rgba(69,216,145,0.2)] group-hover:shadow-[0_0_30px_rgba(69,216,145,0.5)] transition-all duration-300 transform group-hover:scale-105 active:scale-95">
              <span
                class="material-symbols-outlined text-primary text-5xl md:text-6xl"
                >mic</span
              >
            </button>
          </div>
          <button
            class="group flex items-center justify-center w-16 h-16 md:w-20 md:h-20 rounded-full bg-surfaceDark border border-primary/10 hover:border-primary/50 transition-all duration-300 hover:scale-105 shadow-lg shadow-black/20">
            <span
              class="material-symbols-outlined text-textLight text-3xl md:text-4xl group-hover:scale-110 transition-transform duration-300"
              >check</span
            >
          </button>
        </div>
        <button
          class="group flex items-center gap-2 mt-4 text-textLight hover:text-highlight transition-colors">
          <span class="material-symbols-outlined text-lg">keyboard</span>
          <span
            class="font-medium text-lg border-b border-transparent group-hover:border-highlight pb-0.5 transition-all"
            >Switch to Text</span
          >
        </button>
        <div
          class="h-16 flex items-center justify-center gap-1.5 w-full max-w-[240px] mt-2 opacity-80">
          <div class="wave-bar h-8 opacity-30"></div>
          <div class="wave-bar h-12 opacity-50"></div>
          <div class="wave-bar h-6 opacity-30"></div>
          <div class="wave-bar h-10 opacity-60"></div>
          <div class="wave-bar h-14 opacity-40"></div>
          <div
            class="wave-bar h-20 opacity-80 bg-primary shadow-[0_0_8px_#45D891]"></div>
          <div class="wave-bar h-12 opacity-50"></div>
          <div class="wave-bar h-16 opacity-70"></div>
          <div class="wave-bar h-8 opacity-40"></div>
          <div
            class="wave-bar h-24 opacity-100 bg-primary shadow-[0_0_12px_#45D891]"></div>
          <div class="wave-bar h-10 opacity-50"></div>
          <div class="wave-bar h-6 opacity-30"></div>
          <div class="wave-bar h-14 opacity-60"></div>
        </div>
      </div>
    </main>
    <footer class="mb-6 relative z-10">
      <p class="text-sm md:text-base text-gray-500 font-medium">
        When you speak your Ideas out loud, you give them
        <span class="text-primary font-bold">Life</span>.
      </p>
    </footer>
  </body>
</html>
