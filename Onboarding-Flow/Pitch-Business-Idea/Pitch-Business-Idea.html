<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pitch Your Business Idea</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#45D891",
              secondary: "#24724D",
              "background-light": "#F9FAF8",
              "background-dark": "#09110C",
              "surface-dark": "#111d15",
              "border-dark": "#1E4D2F",
              "text-muted-dark": "#5BAA77",
              "text-highlight-dark": "#BCFCA1",
              "accent-pale": "#C8FCFF",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Inter", "sans-serif"],
            },
            backgroundImage: {
              "primary-gradient":
                "linear-gradient(135deg, #45D891 0%, #24724D 100%)",
              "primary-gradient-darker":
                "linear-gradient(135deg, #3BBF7E 0%, #1A5237 100%)", // Darker variation
            },
          },
        },
      };
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e4d2f;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #45d891;
      }
      .glass-effect {
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-white font-sans min-h-screen flex flex-col transition-colors duration-300">
    <main class="flex-grow flex items-center justify-center p-6">
      <div class="w-full max-w-2xl flex flex-col items-center text-center">
        <div
          class="w-14 h-14 mb-8 rounded-full bg-gray-200 dark:bg-border-dark flex items-center justify-center shadow-sm">
          <span class="text-2xl font-bold text-gray-600 dark:text-primary"
            >P</span
          >
        </div>
        <h1
          class="text-4xl md:text-5xl font-bold tracking-tight mb-3 text-gray-900 dark:text-white">
          Pitch your <br class="md:hidden" />
          Business Idea
        </h1>
        <p
          class="text-gray-500 dark:text-text-muted-dark text-lg mb-10 font-medium">
          and we'll transform it for Success
        </p>
        <div class="w-full relative group mb-8">
          <textarea
            class="w-full h-72 p-6 pb-20 rounded-3xl bg-white dark:bg-surface-dark/40 border border-gray-300 dark:border-border-dark text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-text-muted-dark/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent resize-none shadow-sm dark:shadow-none transition-all duration-300 text-lg leading-relaxed"
            placeholder="Describe your vision..."></textarea>
          <div class="absolute bottom-6 left-0 right-0 flex justify-center">
            <button
              class="flex items-center gap-2 px-4 py-2 rounded-full text-gray-500 dark:text-text-highlight-dark hover:text-primary dark:hover:text-primary hover:bg-gray-100 dark:hover:bg-border-dark/50 transition-all duration-300 group-focus-within:text-primary dark:group-focus-within:text-primary">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
                <path
                  d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
              </svg>
              <span class="font-medium">Switch to Voice</span>
            </button>
          </div>
        </div>
        <button
          class="w-full py-4 rounded-xl bg-gray-800 dark:bg-primary-gradient-darker text-white font-semibold text-lg shadow-lg hover:shadow-xl dark:shadow-primary/10 dark:hover:shadow-primary/30 transform hover:-translate-y-0.5 transition-all duration-300 border border-transparent dark:border-white/10">
          Transform my Idea
        </button>
        <p
          class="mt-8 text-sm text-gray-400 dark:text-text-muted-dark opacity-80">
          When you speak your Ideas out loud, you give them Life.
        </p>
      </div>
    </main>
  </body>
</html>
