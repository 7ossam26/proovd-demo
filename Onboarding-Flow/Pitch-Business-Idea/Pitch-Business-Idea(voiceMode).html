<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pitch Business Idea (Voice Mode) - PROOVD</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Satoshi:wght@300;400;500;700&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "#09110C",
              surface: "#0F1A13",
              primary: "#45D891",
              "primary-dark": "#24724D",
              "primary-light": "#BCFCA1",
              text: "#F9FAF8",
              "accent-dark": "#1E4D2F",
              "accent-mid": "#5BAA77",
              "accent-highlight": "#C8FCFF",
            },
            fontFamily: {
              sans: ["Satoshi", "sans-serif"],
              display: ["Satoshi", "sans-serif"],
            },
            animation: {
              "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #09110c;
        color: #f9faf8;
        font-family: "Satoshi", sans-serif;
      }
      .mic-gradient {
        background: linear-gradient(135deg, #45d891 0%, #24724d 100%);
      }
      .audio-wave {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        height: 24px;
      }
      .bar {
        width: 4px;
        background-color: #45d891;
        border-radius: 9999px;
        animation: wave 1.5s ease-in-out infinite;
      }
      .bar:nth-child(even) {
        background-color: #1e4d2f;
      }
      @keyframes wave {
        0%,
        100% {
          height: 4px;
          opacity: 0.3;
        }
        50% {
          height: 20px;
          opacity: 1;
        }
      }
      .bar:nth-child(1) {
        animation-delay: 0.1s;
      }
      .bar:nth-child(2) {
        animation-delay: 0.2s;
      }
      .bar:nth-child(3) {
        animation-delay: 0.3s;
      }
      .bar:nth-child(4) {
        animation-delay: 0.4s;
      }
      .bar:nth-child(5) {
        animation-delay: 0.5s;
      }
      .bar:nth-child(6) {
        animation-delay: 0.4s;
      }
      .bar:nth-child(7) {
        animation-delay: 0.3s;
      }
      .bar:nth-child(8) {
        animation-delay: 0.2s;
      }
      .bar:nth-child(9) {
        animation-delay: 0.1s;
      }
      .bar:nth-child(10) {
        animation-delay: 0.2s;
      }
      .bar:nth-child(11) {
        animation-delay: 0.3s;
      }
      .bar:nth-child(12) {
        animation-delay: 0.4s;
      }
      .bar:nth-child(13) {
        animation-delay: 0.5s;
      }
      .bar:nth-child(14) {
        animation-delay: 0.4s;
      }
      .bar:nth-child(15) {
        animation-delay: 0.3s;
      }
      .bar:nth-child(16) {
        animation-delay: 0.2s;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary selection:text-bg overflow-hidden relative">
    <div
      class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
      <div
        class="absolute top-[-10%] left-[20%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px]"></div>
      <div
        class="absolute bottom-[-10%] right-[10%] w-[400px] h-[400px] bg-accent-dark/10 rounded-full blur-[80px]"></div>
    </div>
    <main
      class="w-full max-w-2xl flex flex-col items-center text-center space-y-12 z-10">
      <div class="flex items-center justify-center">
        <div
          class="w-16 h-16 rounded-full bg-[#0F1A13] border border-accent-dark/50 flex items-center justify-center shadow-[0_0_20px_rgba(69,216,145,0.1)]">
          <span class="font-display font-bold text-3xl text-primary">P</span>
        </div>
      </div>
      <div class="space-y-4">
        <h1
          class="text-4xl md:text-5xl font-bold font-display tracking-tight text-text">
          Pitch your <br class="hidden md:block" />
          <span
            class="text-transparent bg-clip-text bg-gradient-to-r from-primary via-primary-light to-accent-highlight"
            >Business Idea</span
          >
        </h1>
        <p class="text-lg md:text-xl text-primary-light/80 font-medium">
          and we’ll transform it for Success
        </p>
      </div>
      <div class="relative group py-4">
        <div
          class="absolute inset-0 rounded-full bg-primary/20 blur-2xl scale-75 group-hover:scale-100 transition-transform duration-500"></div>
        <div
          class="absolute inset-0 rounded-full bg-primary/10 blur-3xl scale-90 group-hover:scale-110 transition-transform duration-700 delay-75"></div>
        <button
          class="relative w-40 h-40 md:w-48 md:h-48 rounded-full mic-gradient shadow-[0_20px_50px_-12px_rgba(69,216,145,0.2)] hover:shadow-[0_20px_50px_-12px_rgba(69,216,145,0.4)] flex items-center justify-center transform hover:scale-[1.02] transition-all duration-300 cursor-pointer focus:outline-none focus:ring-4 focus:ring-primary/20">
          <span
            class="material-symbols-outlined text-6xl text-white"
            style="
              font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            "
            >mic</span
          >
        </button>
      </div>
      <div class="space-y-8 w-full flex flex-col items-center">
        <button
          class="inline-flex items-center gap-2 text-primary-light hover:text-white transition-colors duration-200 group">
          <span
            class="material-symbols-outlined text-2xl group-hover:-translate-x-1 transition-transform"
            >keyboard</span
          >
          <span class="text-lg font-medium">Switch to Text</span>
        </button>
        <div class="audio-wave opacity-50">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <p class="text-sm text-accent-mid font-medium tracking-wide">
          When you speak your Ideas out loud, you give them Life.
        </p>
      </div>
    </main>
  </body>
</html>
