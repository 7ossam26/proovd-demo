<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pitch Your Business Idea - PROOVD</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#09110C",
              surface: "#131C16",
              text: "#F9FAF8",
              primary: "#45D891",
              "primary-dark": "#24724D",
              "secondary-green": "#1E4D2F",
              "muted-green": "#5BAA77",
              "accent-light": "#BCFCA1",
              "pale-blue": "#C8FCFF",
            },
            fontFamily: {
              sans: ["Outfit", "sans-serif"],
            },
            animation: {
              wave: "wave 1.2s ease-in-out infinite",
              "pulse-glow":
                "pulse-glow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            },
            keyframes: {
              wave: {
                "0%, 100%": { transform: "scaleY(0.4)" },
                "50%": { transform: "scaleY(1.2)" },
              },
              "pulse-glow": {
                "0%, 100%": { opacity: 1 },
                "50%": { opacity: 0.5 },
              },
            },
          },
        },
      };
    </script>
    <style>
      .wave-bar {
        animation: wave 1s ease-in-out infinite;
        border-radius: 9999px;
      }
      .wave-bar:nth-child(odd) {
        animation-duration: 0.9s;
      }
      .wave-bar:nth-child(2n) {
        animation-duration: 1.1s;
      }
      .wave-bar:nth-child(3n) {
        animation-duration: 1.3s;
      }
      .wave-bar:nth-child(4n) {
        animation-duration: 1s;
      }
      .wave-bar:nth-child(5n) {
        animation-duration: 1.4s;
      }
    </style>
  </head>
  <body
    class="bg-background text-text font-sans min-h-screen flex flex-col items-center justify-center relative overflow-hidden selection:bg-primary selection:text-background">
    <div
      class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
      <div
        class="absolute top-[-15%] left-[10%] w-[600px] h-[600px] bg-secondary-green/20 rounded-full blur-[120px]"></div>
      <div
        class="absolute bottom-[-10%] right-[10%] w-[500px] h-[500px] bg-primary-dark/15 rounded-full blur-[120px]"></div>
    </div>
    <header class="absolute top-0 w-full p-8 flex justify-center z-10">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-xl bg-gradient-to-br from-secondary-green to-background border border-primary/20 flex items-center justify-center shadow-lg shadow-primary/5">
          <span class="text-primary font-bold text-xl">P</span>
        </div>
        <span class="text-2xl font-bold tracking-tight text-white">PROOVD</span>
      </div>
    </header>
    <main
      class="relative z-10 w-full max-w-2xl px-6 text-center flex flex-col items-center gap-14">
      <div class="space-y-4">
        <h1
          class="text-4xl md:text-6xl font-extrabold tracking-tight text-white drop-shadow-sm leading-tight">
          Pitch your <br class="hidden md:block" />
          <span
            class="text-transparent bg-clip-text bg-gradient-to-r from-primary via-accent-light to-pale-blue animate-pulse-glow"
            >Business Idea</span
          >
        </h1>
        <p class="text-lg text-gray-400 font-medium tracking-wide">
          and we’ll transform it for Success
        </p>
      </div>
      <div class="flex flex-col items-center gap-10 w-full">
        <div class="relative group">
          <div
            class="absolute inset-0 bg-primary/20 rounded-full animate-ping opacity-50 duration-1000"></div>
          <div
            class="absolute inset-[-20px] bg-primary/5 rounded-full blur-2xl transition-all duration-500 group-hover:bg-primary/10"></div>
          <button
            class="relative w-32 h-32 md:w-40 md:h-40 rounded-full flex items-center justify-center shadow-[0_0_50px_-10px_rgba(69,216,145,0.3)] transition-transform duration-300 hover:scale-105 active:scale-95 bg-gradient-to-br from-primary to-primary-dark border-[6px] border-surface/50 backdrop-blur-sm z-20">
            <div
              class="w-10 h-10 md:w-12 md:h-12 bg-white rounded-md shadow-sm transform transition-transform group-hover:scale-90"></div>
          </button>
        </div>
        <button
          class="flex items-center gap-3 px-6 py-2.5 rounded-full text-accent-light hover:text-white hover:bg-white/5 transition-all duration-300 border border-transparent hover:border-white/10 group">
          <span
            class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform"
            >keyboard</span
          >
          <span class="text-sm font-semibold tracking-wide uppercase opacity-90"
            >Switch to Text</span
          >
        </button>
        <div
          class="h-24 flex items-center justify-center gap-1.5 md:gap-2 w-full max-w-lg px-4 mt-2">
          <div
            class="wave-bar w-1.5 md:w-2 bg-secondary-green h-6 opacity-40"></div>
          <div
            class="wave-bar w-1.5 md:w-2 bg-secondary-green h-10 opacity-60"></div>
          <div class="wave-bar w-1.5 md:w-2 bg-muted-green h-8"></div>
          <div class="wave-bar w-1.5 md:w-2 bg-muted-green h-14"></div>
          <div
            class="wave-bar w-1.5 md:w-2 bg-primary h-12 shadow-[0_0_15px_rgba(69,216,145,0.3)]"></div>
          <div
            class="wave-bar w-1.5 md:w-2 bg-accent-light h-20 shadow-[0_0_20px_rgba(188,252,161,0.5)]"></div>
          <div
            class="wave-bar w-1.5 md:w-2 bg-pale-blue h-24 shadow-[0_0_25px_rgba(200,252,255,0.6)]"></div>
          <div
            class="wave-bar w-1.5 md:w-2 bg-accent-light h-16 shadow-[0_0_20px_rgba(188,252,161,0.5)]"></div>
          <div
            class="wave-bar w-1.5 md:w-2 bg-primary h-10 shadow-[0_0_15px_rgba(69,216,145,0.3)]"></div>
          <div class="wave-bar w-1.5 md:w-2 bg-muted-green h-14"></div>
          <div class="wave-bar w-1.5 md:w-2 bg-muted-green h-7"></div>
          <div
            class="wave-bar w-1.5 md:w-2 bg-secondary-green h-9 opacity-60"></div>
          <div
            class="wave-bar w-1.5 md:w-2 bg-secondary-green h-5 opacity-40"></div>
        </div>
      </div>
    </main>
    <footer class="absolute bottom-8 w-full text-center px-6 z-10">
      <p
        class="text-sm md:text-base text-gray-500/80 font-medium tracking-wide">
        When you speak your Ideas out loud, you give them Life.
      </p>
    </footer>
  </body>
</html>
