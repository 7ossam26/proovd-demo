<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#45D891",
                        "primary-dark": "#2ea36b",
                        "primary-bg": "#09110C",
                        "secondary-bg": "#131C16",
                        "accent-dark": "#1E4D2F",

                        "border-green": "#24724D",
                    },
                    fontFamily: {
                        sans: ["Satoshi", "sans-serif"],
                        display: ["Satoshi", "sans-serif"],
                        body: ["Satoshi", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        'lg': "0.75rem",
                        'xl': "1rem",
                        '2xl': "1.5rem",
                    },
                    backgroundImage: {
                        'gradient-green': 'linear-gradient(135deg, #45D891 2%, #24724D 100%)',
                        'gradient-dark': 'linear-gradient(to bottom, #09110C, #0F1A13)',
                    }
                },
            },
        };
    </script>
<style>
    body {
        background-color: #09110C;
        color: #F9FAF8;
    }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0
    }
    input[type=number] {
    -moz-appearance: textfield
    }
    .dotted-border {
        background-image: radial-gradient(#24724D 1px, transparent 1px);
        background-size: 20px 20px;
        border: 1px solid #1E4D2F;
        border-radius: 1rem;
    }
    .gradient-orb {
        background: radial-gradient(circle at center, rgba(69, 216, 145, 0.08) 0%, rgba(9, 17, 12, 0) 70%);
    }
    .glass-panel {
        background: rgba(19, 28, 22, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(69, 216, 145, 0.1);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
</style>
</head>
<body class="font-sans min-h-screen flex flex-col antialiased bg-[#09110C]">
<header class="w-full px-8 py-6 flex justify-between items-center z-10">
<div class="flex items-center gap-3">
<div class="w-10 h-10 flex items-center justify-center bg-[#131C16] rounded-md border border-[#1E4D2F]/50 p-1.5">
<img alt="PROOVD Logo Mark" class="w-full h-full object-contain opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGymw5_e1IOBdXWS9SPqsDUuVuP9FTkx7fk6r6RjfrNSQrZIYw0Ccpj7pS1M65ZLB44D-oYM6KkgTD3DhMTL4yo5RrMlaxgx3Xcxo8P1T3X3oBypI1fEk9Y76eeGxKZEtKVWVLIcRvR7qZlaC-kA-0K4R4w7aw7wI-mKdEsQRV_EKeYYVnylRGtsmWpNl9tsKpTg0QYxdq07LC44nFGsiLmaXwGnlHd7uksAXn52HyGPOqKiorw0cbZozo7qElebLYwnqxgTp-7eyo"/>
</div>
<span class="text-xl font-bold tracking-tight text-[#45D891]">PROOVD</span>
</div>
<div class="flex items-center gap-4">
</div>
</header>
<main class="flex-grow flex items-center justify-center relative px-4 overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] gradient-orb pointer-events-none z-0"></div>
<div class="absolute top-0 right-0 w-96 h-96 bg-[#45D891] rounded-full blur-[150px] opacity-5 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-64 h-64 bg-[#24724D] rounded-full blur-[100px] opacity-10 pointer-events-none"></div>
<div class="w-full max-w-md relative z-10">
<div class="mb-8 text-center">
<h1 class="text-4xl md:text-5xl font-bold font-display text-white mb-4 tracking-tight">Set your passcode</h1>
<p class="text-[#5BAA77] text-base md:text-lg max-w-xs mx-auto leading-relaxed">
    Create a secure 3-digit passcode to access your campaign settings.
</p>
</div>
<div class="glass-panel p-8 md:px-10 md:py-8 rounded-2xl relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#45D891] to-transparent opacity-20"></div>
<form class="space-y-8" onsubmit="event.preventDefault();">
<div class="flex flex-col items-center space-y-3">
<label class="text-[#5BAA77] text-xs font-bold uppercase tracking-widest" for="passcode-1">Enter Passcode</label>
<div class="flex gap-4 justify-center w-full">
<input autofocus="" class="w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-bold bg-[#0F1A13] border border-[#1E4D2F] rounded-xl focus:ring-2 focus:ring-[#45D891] focus:border-[#45D891] text-[#45D891] outline-none transition-all shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)] placeholder-[#24724D]" id="passcode-1" maxlength="1" placeholder="•" type="number"/>
<input class="w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-bold bg-[#0F1A13] border border-[#1E4D2F] rounded-xl focus:ring-2 focus:ring-[#45D891] focus:border-[#45D891] text-[#45D891] outline-none transition-all shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)] placeholder-[#24724D]" maxlength="1" placeholder="•" type="number"/>
<input class="w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-bold bg-[#0F1A13] border border-[#1E4D2F] rounded-xl focus:ring-2 focus:ring-[#45D891] focus:border-[#45D891] text-[#45D891] outline-none transition-all shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)] placeholder-[#24724D]" maxlength="1" placeholder="•" type="number"/>
</div>
</div>
<div class="flex justify-center pt-2">
<div class="text-xs text-[#5BAA77] flex items-center gap-1.5 bg-[#1E4D2F]/20 px-3 py-1.5 rounded-full border border-[#1E4D2F]/50">
<span class="material-icons text-sm" style="font-size: 14px;">lock</span>
<span class="font-medium tracking-wide uppercase text-[10px]">Security Verification</span>
</div>
</div>
<button class="w-full py-4 px-6 bg-[#45D891] hover:bg-[#3bc280] text-[#09110C] font-bold text-lg rounded-xl transition-all duration-300 shadow-[0_0_15px_rgba(69,216,145,0.2)] hover:shadow-[0_0_25px_rgba(69,216,145,0.4)] transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 group" type="submit">
<span>Confirm Passcode</span>
<span class="material-icons group-hover:translate-x-1 transition-transform text-lg">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<a class="text-sm text-[#5BAA77] hover:text-[#45D891] transition-colors underline decoration-dotted underline-offset-4" href="#">
                        Cancel and return to dashboard
                    </a>
</div>
</div>
</div>
</main>
<footer class="w-full py-8 text-center text-xs text-[#1E4D2F] font-medium tracking-wider uppercase">
        © 2025 PROOVD. All rights reserved.
    </footer>
<script>
        const inputs = document.querySelectorAll('input[type="number"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if(e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if(e.target.value.length === 1) {
                    if(index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && e.target.value === '') {
                    if(index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });
    </script>
</body></html>
